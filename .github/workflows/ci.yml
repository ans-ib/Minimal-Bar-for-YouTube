name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run source:mozilla

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: web-ext-artifacts/*.zip
